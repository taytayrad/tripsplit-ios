<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join a trip on TripSplit</title>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: GrayText; margin: 0 0 1.5rem; }
  a.button { display: block; padding: .9rem; border-radius: .75rem; text-decoration: none; font-weight: 600; margin-bottom: .75rem; }
  .primary { background: #0062CC; color: #fff; }
  .secondary { border: 1px solid GrayText; color: CanvasText; }
</style>
</head><body><main>
<h1>You're invited to a trip</h1>
<p>Open TripSplit to join. New here? Get the app first, then tap the link again.</p>
<a class="button primary" id="open" href="#">Open TripSplit</a>
<a class="button secondary" href="https://apps.apple.com/">Get TripSplit</a>
</main>
<script>
  // The token rides in the #fragment, so it never reaches the server.
  // ponytail: generic App Store link until the listing is live.
  var token = location.hash.slice(1);
  if (/^[0-9a-f]{32}$/.test(token)) {
    var app = "tripsplit://join/" + token;
    document.getElementById("open").href = app;
    location.href = app;
  } else {
    document.querySelector("h1").textContent = "Invite link not found";
    document.getElementById("open").hidden = true;
  }
</script>
</body></html>
