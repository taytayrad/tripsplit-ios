<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join a trip on TripSplit</title>
<style>
  :root {
    color-scheme: light dark; font-family: -apple-system, system-ui, sans-serif;
    --blue: #1F5BB8; --green: #2E7D4F; --red: #D2452C;  /* the app's stamp inks */
  }
  @media (prefers-color-scheme: dark) { :root { --blue: #6EA1FF; --green: #6FD39A; --red: #FF8A73; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
  .stamps { display: flex; justify-content: center; align-items: center; gap: .25rem; margin-bottom: 1.25rem; }
  .stamp { width: 5.5rem; height: 5.5rem; overflow: visible; }
  .stamp.blue { color: var(--blue); width: 4.75rem; }
  .stamp.green { color: var(--green); }
  .stamp.red { color: var(--red); width: 4.75rem; }
  [hidden] { display: none !important; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: GrayText; margin: 0 0 1.5rem; }
  a.button { display: block; padding: .9rem; border-radius: .75rem; text-decoration: none; font-weight: 600; margin-bottom: .75rem; }
  .primary { background: #0062CC; color: #fff; }
  .secondary { border: 1px solid GrayText; color: CanvasText; }
</style>
</head><body><main>
<div class="stamps">
<svg class="stamp blue" viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
  <g transform="rotate(-6 60 60)">
    <rect x="12" y="32" width="96" height="56" rx="16" stroke-width="4"/><rect x="19" y="39" width="82" height="42" rx="10" stroke-width="1.5"/>
    <g transform="translate(46.0 46.0) scale(1.1666666666666667)" stroke-width="1.6"><path d="M12 3v14M11 5 4 15h7ZM13 8l6 7h-6ZM3 17h18l-3 4H6Z"/></g>
  </g>
</svg>
<svg class="stamp green" viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
  <g transform="rotate(7 60 60)">
    <circle cx="60" cy="60" r="48" stroke-width="4"/><circle cx="60" cy="60" r="41" stroke-width="1.5"/>
    <g transform="translate(42.0 42.0) scale(1.5)" stroke-width="1.6"><path d="M2 20 12 4l10 16ZM9 20l3-6 3 6"/></g>
  </g>
</svg>
<svg class="stamp red" viewBox="0 0 120 120" aria-hidden="true" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
  <g transform="rotate(-4 60 60)">
    <polygon points="104.35,78.37 78.37,104.35 41.63,104.35 15.65,78.37 15.65,41.63 41.63,15.65 78.37,15.65 104.35,41.63" stroke-width="4"/><polygon points="97.88,75.69 75.69,97.88 44.31,97.88 22.12,75.69 22.12,44.31 44.31,22.12 75.69,22.12 97.88,44.31" stroke-width="1.5"/>
    <g transform="translate(42.0 42.0) scale(1.5)" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M17.09 6.91l2.12-2.12M6.91 6.91 4.79 4.79M17.09 17.09l2.12 2.12M6.91 17.09l-2.12 2.12"/></g>
  </g>
</svg>
</div>
<h1>You're invited to a trip</h1>
<p>Open TripSplit to join. New here? Get the app first, then tap the link again.</p>
<a class="button primary" id="open" href="#">Open TripSplit</a>
<a class="button secondary" href="https://apps.apple.com/">Get TripSplit</a>
</main>
<script>
  // The token rides in the #fragment, so it never reaches the server.
  // ponytail: generic App Store link until the listing is live.
  var token = location.hash.slice(1);
  if (/^[0-9a-f]{32}$/.test(token)) {
    var app = "tripsplit://join/" + token;
    document.getElementById("open").href = app;
    location.href = app;
  } else {
    document.querySelector("h1").textContent = "Invite link not found";
    document.getElementById("open").hidden = true;
  }
</script>
</body></html>
