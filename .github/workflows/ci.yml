name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen && xcodebuild -version
      - name: Test
        working-directory: ios
        run: |
          xcodebuild test -project TripSplit.xcodeproj -scheme TripSplit \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "error:" xcodebuild.log | sort -u | head -50 || true
          tail -40 xcodebuild.log
          exit $status

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset  # applies migrations, then seed.sql (test helpers)
      - run: supabase test db
