name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen && xcodebuild -version
      - name: Test
        working-directory: ios
        run: |
          xcodebuild test -project TripSplit.xcodeproj -scheme TripSplit \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "error:" xcodebuild.log | sort -u | head -50 || true
          tail -40 xcodebuild.log
          exit $status
