name: TripSplit
options:
  bundleIdPrefix: com.taylor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
targets:
  TripSplit:
    type: application
    platform: iOS
    sources: [TripSplit]
    info:
      path: TripSplit/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.taylor.tripsplit
            CFBundleURLSchemes: [tripsplit]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true  # Debug builds talk to the local Supabase over http
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.taylor.tripsplit
        INFOPLIST_KEY_CFBundleDisplayName: TripSplit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TripSplit/TripSplit.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "PHVU622P3U"
    dependencies:
      - package: Supabase
  TripSplitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TripSplitTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TripSplit.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TripSplit"
    dependencies:
      - target: TripSplit
schemes:
  TripSplit:
    build:
      targets:
        TripSplit: all
        TripSplitTests: [test]
    test:
      targets: [TripSplitTests]
